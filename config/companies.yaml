# IMPORTANT: This file is a SEED/TEMPLATE. The spec references a full list in
# `Job_Search_Target_Companies.docx` that was not available to import automatically.
# Run `python -m job_search_agent.discover_ats "Company Name"` for each company in
# your source doc to find its ATS + slug, then add an entry below in the matching
# section. Re-run discovery monthly (see spec's "Error Handling / Etiquette").
#
# Schema per company:
#   - name: "Display Name"
#     ats: greenhouse | lever | ashby | smartrecruiters | workday | tier2
#     slug: "company-slug"          # ATS board slug (not needed for tier2)
#     careers_url: "https://..."    # required for tier2, optional documentation otherwise
